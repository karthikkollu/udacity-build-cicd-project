name: Frontend Continuous Deployment

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontend
  EKS_CLUSTER_NAME: cluster
  EKS_NODEGROUP_NAME: udacity

jobs:

  # =========================
  # LINT JOB
  # =========================
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Frontend
        run: npm run lint


  # =========================
  # TEST JOB
  # =========================
  test:
    name: Test Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test Frontend
        run: npm test -- --watchAll=false


  # =========================
  # DEPLOY JOB
  # =========================
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:

      # -------------------------
      # CHECKOUT
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -------------------------
      # AWS CREDENTIALS
      # -------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # -------------------------
      # LOGIN TO AMAZON ECR
      # -------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # -------------------------
      # BUILD FRONTEND IMAGE
      # -------------------------
      - name: Build Frontend Docker image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=${{ secrets.REACT_APP_MOVIE_API_URL }} \
            --tag ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            .


      # -------------------------
      # PUSH IMAGE TO ECR
      # -------------------------
      - name: Push Frontend image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}


      # -------------------------
      # UPDATE KUBECONFIG
      # -------------------------
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}


      # -------------------------
      # UPDATE FRONTEND DEPLOYMENT
      # -------------------------
      - name: Deploy Frontend to EKS
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}


      # -------------------------
      # WAIT FOR DEPLOYMENT
      # -------------------------
      - name: Verify Frontend deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=5m
