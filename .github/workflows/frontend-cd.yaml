name: Frontend Continuous Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontend
  EKS_CLUSTER_NAME: cluster

jobs:

  # =========================================================
  # 1. LINT FRONTEND
  # =========================================================
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run lint
        working-directory: starter/frontend
        run: npm run lint


  # =========================================================
  # 2. TEST FRONTEND
  # =========================================================
  test:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run tests
        working-directory: starter/frontend
        run: npm test -- --watch=false


  # =========================================================
  # 3. DEPLOY FRONTEND
  # =========================================================
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # AWS credentials
      # -----------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # -----------------------------------------------------
      # Login to Amazon ECR
      # -----------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # -----------------------------------------------------
      # Build Docker image
      # -----------------------------------------------------
      - name: Build Frontend Docker image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=http://localhost:5000 \
            -t frontend:latest .


      # -----------------------------------------------------
      # Tag Docker image
      # -----------------------------------------------------
      - name: Tag Docker image
        run: |
          docker tag frontend:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest


      # -----------------------------------------------------
      # Push Docker image to ECR
      # -----------------------------------------------------
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest


      # -----------------------------------------------------
      # Configure kubectl for EKS
      # -----------------------------------------------------
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}


      # -----------------------------------------------------
      # Update Kubernetes deployment image
      # -----------------------------------------------------
      - name: Update Kubernetes deployment
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest


      # -----------------------------------------------------
      # Wait for deployment
      # -----------------------------------------------------
      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=180s


      # -----------------------------------------------------
      # Check Kubernetes resources
      # -----------------------------------------------------
      - name: Verify deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services